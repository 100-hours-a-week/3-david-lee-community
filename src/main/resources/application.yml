spring:

  ### DATA-SOURCE 설정
  datasource:
    url: jdbc:mysql://localhost:3306/ktb
    username: local
    password: local
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      max-lifetime: 18000000
      idle-timeout: 6000000

  ### JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        auto_quote_keyword: false
        globally_quoted_identifiers: false
        format_sql: false
        show_sql: false
    defer-datasource-initialization: true
    open-in-view: false

  ### 카테고리 SQL 실행
  sql:
    init:
      mode: always
      platform: mysql

  ### 레디스 설정
  data:
    redis:
      host: localhost
      port: 6379

  thymeleaf:
    cache: false

# jwt
auth:
  session:
    expiration: 604800

#### AWS
cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    S3:
      bucket: ${BUCKET}
    region:
      static: ${STATIC}

cors:
  front:
    host: http://localhost:3000
