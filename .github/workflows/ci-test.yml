name: 아무말 대잔치 테스트 CI 파이프라인

on:
  pull_request:
    branches: ["develop"]

jobs:

  setup-services:
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        ports: ['3306:3306']
        env:
          MYSQL_DATABASE: ktb_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_ROOT_PASSWORD: root
      redis:
        image: redis:7.2.5
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: 자바 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: application-test.yml 설정
        run: |
          mkdir -p src/test/resources
          echo "${{ secrets.APPLICATION_TEST_YML }}" > ./src/test/resources/application-test.yml

      - name: MySQL 체크
        run: |
          until nc -z localhost 3306; do
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Redis 체크
        run: |
          until nc -z localhost 6379; do
            echo "Waiting for Redis..."
            sleep 3
          done

  build:
    runs-on: ubuntu-22.04
    needs: setup-services
    steps:
      - uses: actions/checkout@v4

      - name: 자바 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: 빌드하기
        id: build
        run: ./gradlew clean build -Dspring.profiles.active=prod

  notify-discord:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Discord 빌드 알림
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_BACK_URL }}
          title: ${{ needs.build.result == 'success' && '✅' || '❌' }} PR 빌드 리포트 - ${{ github.repository }}
          description: |
            **브랜치**: `${{ github.ref_name }}`
            **커밋**: [`${{ github.sha }}`](${{ github.event.head_commit.url }})

            **📊 빌드 결과**:
            - 상태: ${{ needs.build.result == 'success' && '성공' || '실패' }}
            - 빌드 시간: ${{ github.run_number }}번째 실행

            **🔗 링크**:
            - [Actions 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ needs.build.result == 'success' && 65280 || 16711680 }}
          username: GitHub Build Bot
          avatar_url: https://github.githubassets.com/favicon.ico
