name: 아무말 대잔치 테스트 PR CI 파이프라인 (Podman)

on:
  pull_request:
    branches: [ "develop"]

jobs:
  test:
    # (기존 테스트 로직은 동일하게 유지 - Java 단위 테스트는 컨테이너 밖에서 하는 것이 훨씬 빠릅니다)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 테스트 실행
        run: ./gradlew test -Dspring.profiles.active=test || true

      - name: Test 결과 업로드
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          junit_files: '**/build/test-results/test/TEST-*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Podman 이미지 빌드 (Multi-stage 적용)
        run: |
          podman build \
            --format oci \
            -t my-app-image:latest .
        # 여기서 '.'은 우리가 이전에 짠 Multi-stage Dockerfile이 있는 경로입니다.

      - name: 빌드된 이미지 확인
        run: podman images

      # (선택 사항) 빌드된 이미지를 검증하거나 레지스트리에 푸시할 수 있습니다.
      # - name: Push to Registry (예시)
      #   run: |
      #     podman push my-app-image:latest ghcr.io/${{ github.repository }}/app:latest

  notify-discord:
    runs-on: ubuntu-latest
    needs: build-image # build에서 build-image로 변경
    if: always()
    steps:
      - name: Discord 빌드 알림
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_BACK_URL }}
          title: "${{ needs.build-image.result == 'success' && '✅' || '❌' }} 새로운 PR이 올라왔습니다!"
          description: |
            **📊 이미지 빌드 결과**:
            - 상태: ${{ needs.build-image.result == 'success' && '성공' || '실패' }}
          color: "${{ needs.build-image.result == 'success' && 65280 || 16711680 }}"
