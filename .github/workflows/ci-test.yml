name: 아무말 대잔치 테스트 CI 파이프라인

### develop으로 PR 올릴 때, 테스트 코드를 실행하여, 빌드 여부 및 테스트를 체크하는 로직을 수행한다.

on:
  pull_request:
    branches: [ "develop"]

jobs:
  #1. 테스트 용
  test:

    runs-on: ubuntu-22.04
    services:

      mysql:
        image: mysql:8.0
        ports:
          - '3306:3306'
        env:
          MYSQL_DATABASE: ktb_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_ROOT_PASSWORD: root

      redis:
        image: redis:7.2.5
        ports:
          - '6379:6379'

    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      # 1-1. repository checkout
      - uses: actions/checkout@v4

      # 1-2. jdk 환경 설치
      - name: 자바 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1-3. '*.yml' 파일 세팅
      - name: application.yml 파일 설정
        run: |

      - name: application-prod.yml 설정
        run: echo "${{ secrets.APPLICATION_PROD_YML }}" > ./src/main/resources/application-dev.yml

      - name: application-test.yml 설정
        run: |
          mkdir -p src/test/resources
          echo "${{ secrets.APPLICATION_TEST_YML }}" > ./src/test/resources/application-test.yml


      # 1-4. 성능 향상을 위한 Gradle 캐싱
      - name: Gradle 캐싱
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 1-5. 테스트 컨테이너들 작동여부 체크
      - name: MySQL 체크
        run: |
          until nc -z localhost 3306; do
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Redis 체크
        run: |
          until nc -z localhost 6379; do
            echo "Waiting for Redis..."
            sleep 3
          done

      # 빌드
      - name: 빌드하기
        run: ./gradlew clean build -Dspring.profiles.active=prod

      # 디스코드 알림 봇
      - name: 디스코드 빌드 알림 봇
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_BACK_URL }}
          title: |
            ${{ job.status == 'success' && '✅' || '❌' }} PR 빌드 리포트 - ${{ github.repository }}
          description: |
            **브랜치**: `${{ github.ref_name }}`
            **커밋**: [`${{ github.sha }}`](${{ github.event.head_commit.url }})
            
            **📊 빌드 결과**:
            - 상태: ${{ steps.build.outputs.status == 'success' && '성공' || '실패' }}
            - 빌드 크기: ${{ steps.build.outputs.size || 'N/A' }}
            - 빌드 시간: ${{ github.run_number }}번째 실행
            
            **🧪 테스트 결과**:
            - 통과: ${{ steps.test.outputs.passed }}/${{ steps.test.outputs.total }}
            - 실패: ${{ steps.test.outputs.failed }}
            - 커버리지: ${{ steps.coverage.outputs.percentage }}%
            
            **🔗 링크**:
            - [Actions 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [커밋 상세보기](${{ github.event.head_commit.url }})
          color: |
            ${{ 
              job.status == 'success' && '0x00ff00' || 
              job.status == 'failure' && '0xff0000' || 
              '0xffff00' 
            }}
          username: GitHub Build Bot
          avatar_url: https://github.githubassets.com/favicon.ico
