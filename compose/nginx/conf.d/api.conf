# ----------------------------------------------------
# 1. HTTP 리디렉션 서버 (BE)
# ----------------------------------------------------
server {
    listen 80;
    server_name api.community.ktb-david.cloud;

    # Certbot 인증용
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
    }

    # 포트 명시 없이 443으로 리디렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# 2. HTTPS BE 서버 (443)
#    https://api.community.ktb-david.cloud → localhost:8080
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name api.community.ktb-david.cloud;

    # SSL 인증서 (api.*용)
    ssl_certificate     /etc/letsencrypt/live/api.community.ktb-david.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.community.ktb-david.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # BE 프록시
    location / {
        proxy_pass http://ktb-be:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }
}
