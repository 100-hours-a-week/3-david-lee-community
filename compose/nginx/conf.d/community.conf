# ----------------------------------------------------
# 1. HTTP 리디렉션 서버 (FE)
# ----------------------------------------------------
server {
    listen 80;
    server_name community.ktb-david.cloud;

    # Certbot 인증용 (webroot 방식)
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
    }

    # 모든 HTTP 요청을 HTTPS(443)로 리디렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# 2. HTTPS FE 서버 (443)
#    https://community.ktb-david.cloud → localhost:3000
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name community.ktb-david.cloud;

    # SSL 인증서 (이 도메인용으로 발급)
    ssl_certificate     /etc/letsencrypt/live/community.ktb-david.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.ktb-david.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # FE 프록시
    location / {
        proxy_pass http://ktb-fe:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
