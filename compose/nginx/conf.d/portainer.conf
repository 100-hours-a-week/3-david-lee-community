# ----------------------------------------------------
# 1. HTTP 리디렉션 서버 (Portainer)
# ----------------------------------------------------
server {
    listen 80;
    server_name portainer.ktb-david.cloud;

    # Certbot 인증용
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
    }

    # Portainer는 외부 9443 포트 유지
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# 2. HTTPS Portainer 서버 (443)
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name portainer.ktb-david.cloud;

    # SSL 인증서 (portainer.*용)
    ssl_certificate     /etc/letsencrypt/live/portainer.ktb-david.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.ktb-david.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://ktb-portainer:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
